# Configurações para testes de integração
spring:
  application:
    name: schedule-management-service-test
  
  # Configuração do DataSource (H2 para testes)
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  
  # JPA sem criar tabelas (vamos usar Testcontainers quando necessário)
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  
  # Kafka desabilitado para testes unitários simples
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      auto-offset-reset: earliest
    producer:
      acks: all
  
  # Redis desabilitado para testes unitários
  data:
    redis:
      host: localhost
      port: 6379
  
  # Flyway desabilitado para testes unitários
  flyway:
    enabled: false

# Server port para testes
server:
  port: 0

# Logging
logging:
  level:
    com.distrischool.schedule: INFO
    org.springframework: WARN

