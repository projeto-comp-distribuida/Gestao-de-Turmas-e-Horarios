# Configurações para testes de integração
spring:
  application:
    name: schedule-management-service-test
  
  # Database configuration will be overridden by Testcontainers
  datasource:
    url: jdbc:postgresql://localhost:5432/test_schedule
    username: test
    password: test
    driver-class-name: org.postgresql.Driver
  
  # JPA configuration for tests
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  
  # Flyway - disable for tests if using JPA auto-update
  flyway:
    enabled: false
  
  # Redis - disable cache for tests
  data:
    redis:
      host: localhost
      port: 6379
  cache:
    type: none
  
  # Kafka - use embedded Kafka for tests
  kafka:
    bootstrap-servers: ${spring.embedded.kafka.brokers:localhost:9092}
    consumer:
      group-id: schedule-service-test-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  
  # Security - disable for integration tests
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.oauth2.resource.servlet.OAuth2ResourceServerAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration

# Disable security for integration tests
security:
  disable: true

# Kafka topics configuration
microservice:
  kafka:
    topics:
      events: distrischool.events
      schedule-updated: distrischool.schedule.updated

# Logging
logging:
  level:
    com.distrischool: DEBUG
    org.springframework: INFO
    org.hibernate: INFO
    org.testcontainers: INFO
    org.springframework.kafka: DEBUG

